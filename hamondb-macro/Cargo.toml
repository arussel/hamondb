[package]
name = "hamondb-macro"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"

[dev-dependencies]
trybuild = "1"
hamondb = {path = "../hamondb"}
hamondb-macro = {path = "."}
